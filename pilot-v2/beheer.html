<style>
:root{--dark:#12392b;--green:#317b55;--light:#e7f4e8;--cream:#f7f9f6;--text:#17382a;--muted:#6b8976;--border:#e2eae3;
--display:'Fraunces',Georgia,serif;--body:'Inter',Arial,sans-serif;--mono:'IBM Plex Mono',monospace;
--ok:#2f7a4f;--okbg:#e5f4e9;--warn:#9a6a12;--warnbg:#fbf1dc;--info:#2c5d8a;--infobg:#e7f0fa;--bad:#a23b3b;--badbg:#fbeaea;--grey:#5f6f66;--greybg:#eef1ee}
*{box-sizing:border-box}body{margin:0;font-family:var(--body);background:var(--cream);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.demo-banner{background:#fff4d6;color:#6b4e00;text-align:center;font-size:12px;padding:7px 12px;border-bottom:1px solid #f0dfa8}
header{background:#fff;border-bottom:1px solid var(--border)}
.hdr{max-width:1320px;margin:auto;padding:0 24px;min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;text-decoration:none;color:var(--text)}
.logo b{width:40px;height:40px;border-radius:11px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font:600 14px var(--mono)}
.logo small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.who{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.role{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;background:var(--light);color:var(--green);padding:4px 8px;border-radius:6px}
.btn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:500}
.btn:hover{border-color:#c6d6c9}.btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}.btn.primary:hover{background:#0d2c21}
.btn.small{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1320px;margin:auto;padding:22px 24px 60px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{background:none;border:none;padding:11px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-color:var(--dark)}
h1{font:600 26px var(--display);margin:0 0 4px}h2{font:600 19px var(--display);margin:0 0 12px}h3{font-size:13px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat b{display:block;font:600 24px var(--display);margin-top:4px}.stat small{color:var(--muted);font-size:11px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input,.filters select,.form input,.form select,.form textarea{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff;color:var(--text)}
.filters input{min-width:240px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #eef2ee;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:#fbfcfb;position:sticky;top:0}
tbody tr{cursor:pointer}tbody tr:hover{background:#f6faf6}tbody tr.sel{background:#eef6ef}
td .s{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-info{background:var(--infobg);color:var(--info)}.c-bad{background:var(--badbg);color:var(--bad)}.c-grey{background:var(--greybg);color:var(--grey)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.layout{display:grid;grid-template-columns:1fr;gap:18px}
.layout.open{grid-template-columns:minmax(0,1fr) 520px}
.detail{padding:20px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.detail .close{float:right}
.two{display:grid;grid-template-columns:1fr;gap:6px}
.kv{display:grid;grid-template-columns:44% 56%;gap:8px;padding:7px 0;border-bottom:1px dashed #edf1ed;font-size:13px}
.kv span{color:var(--muted)}.kv b{font-weight:500;word-break:break-word}
.box{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:10px;background:#fcfdfc}
.box.orig{border-left:3px solid #9fb8a6}.box.int{border-left:3px solid var(--dark)}
.form{display:grid;gap:8px;margin-top:8px}.form .row{display:flex;gap:8px;flex-wrap:wrap}.form .row>*{flex:1;min-width:120px}
.form textarea{min-height:60px;resize:vertical}
.msg{font-size:12px;margin-top:6px;min-height:16px}.badge{display:inline-block;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px;font-weight:600;vertical-align:1px}.newbox{border:1px solid #e3a33b;background:#fffaf0;border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:13px}.newbox li{margin:3px 0}.auto{background:#fff6e5!important;border-color:#e3a33b!important}.xbox{border:1px solid #e3d3a8;background:#fffaf0;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px}.xbox ul{margin:6px 0 0 18px;padding:0}.xbox pre{white-space:pre-wrap;font-size:11px;max-height:220px;overflow:auto;background:#fff;border:1px solid var(--line,#e3e0d5);padding:8px;border-radius:6px}.doclist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.timeline{list-style:none;margin:0;padding:0}.timeline li{padding:8px 0;border-bottom:1px solid #eef2ee;font-size:12px}.timeline li span{color:var(--muted);display:block}
.note{padding:9px 0;border-bottom:1px solid #eef2ee;font-size:13px;white-space:pre-wrap}.note span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.gate a{color:var(--dark);font-weight:500}.gate{max-width:520px;margin:60px auto;text-align:center;padding:34px}.gate p{color:var(--muted);line-height:1.6}
.hint{font-size:12px;color:var(--muted)}
.num{text-align:right;white-space:nowrap}.pct-up{color:var(--bad);font-weight:600}.pct-mid{color:var(--warn);font-weight:600}.pct-down{color:var(--ok);font-weight:600}
.sig{border-left:3px solid var(--bad);background:#fff;padding:10px 14px;border-radius:10px;margin:8px 0;font-size:13px}.sig b{display:block;margin-bottom:2px}.sig .s{display:block;margin-top:4px}.form label.hint{display:flex;flex-direction:column;gap:4px}.form label.hint input{width:100%}.orgpick select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit}
.orgpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 16px}.orgpick select{min-width:280px}
@media(max-width:1100px){.layout.open{grid-template-columns:1fr}.detail{position:static;max-height:none}}
@media(max-width:700px){.hide-m{display:none}.filters input{min-width:0;flex:1}}
.ptlist{border:1px solid var(--line,#e3e0d5);border-radius:10px;overflow:hidden}.ptrow{border-bottom:1px solid var(--line,#e3e0d5)}.ptrow:last-child{border-bottom:0}.ptrow>summary,.pttotal{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr 110px 60px;gap:12px;align-items:center;padding:8px 12px;cursor:pointer;list-style:none}.ptrow>summary::-webkit-details-marker{display:none}.ptrow>summary .ptname::before{content:'▸ ';color:#94a3b8}.ptrow[open]>summary .ptname::before{content:'▾ '}.pttotal{cursor:default;background:#f6f5f1}.ptbar{height:8px;background:#eef0ec;border-radius:4px;overflow:hidden}.ptbar i{display:block;height:100%;background:#2f6b4c}
.ptwarn{margin:4px 0 8px;padding:7px 10px;border-radius:8px;background:#fff6e5;border:1px solid #f3d29a;color:#7a4b00;font-size:13px}
</style>
</head>

<script>
'use strict';
/* ------------------------------------------------------------------
   HUOS Beheer (testversie). Alle autorisatie gebeurt in de database
   (RLS + security-definer functies met rolcontrole). Deze pagina bevat
   geen geheimen; zonder interne rol levert de database geen gegevens.
------------------------------------------------------------------- */
const URL_SUPABASE='https://yyvzqnjumnpotawnrvfw.supabase.co';
const KEY_SUPABASE='sb_publishable_QDvjBPDGIgrQNcSzEw2FZg_Yj6hfIgY';
const params=new URLSearchParams(location.search);
const RECOVERY=/type=recovery/.test(location.hash)||/type=recovery/.test(location.search);
const LIVE_HOST=/(^|\.)vercel\.app$/.test(location.hostname)||location.hostname==='localhost';
const DEMO=params.has('demo')||!LIVE_HOST;
const client=(!DEMO&&window.supabase)?window.supabase.createClient(URL_SUPABASE,KEY_SUPABASE,{auth:{storageKey:'huos-beheer-auth',persistSession:true,detectSessionInUrl:true}}):null;
/* Eigen sessie, los van de klantomgeving: medewerker en testklant kunnen tegelijk ingelogd zijn in dezelfde browser. */
const AUTH_REDIRECT=(()=>{try{const o=location.origin;if(/^https:\/\/(app\.horecaunited\.nl|huos-v2-prive-pilot(-[a-z0-9-]+)?\.vercel\.app)$/.test(o))return o+'/'}catch(_){}return 'https://huos-v2-prive-pilot.vercel.app/'})();

const STAGES={new:'Nieuw',contact_needed:'Contact nodig',awaiting_upload:'Wacht op documenten',mandate_pending:'Machtiging in afwachting',document_received:'Document ontvangen',review_needed:'Beoordeling nodig',ready_for_offer:'Klaar voor voorstel',offer_sent:'Voorstel verstuurd',customer:'Klant',closed:'Afgesloten'};
const STAGE_CLS={new:'c-info',contact_needed:'c-warn',awaiting_upload:'c-warn',mandate_pending:'c-warn',document_received:'c-info',review_needed:'c-info',ready_for_offer:'c-ok',offer_sent:'c-ok',customer:'c-ok',closed:'c-grey'};
const HLQ={verified:['Geverifieerd','c-ok'],reported_invoice:['Opgegeven (facturen)','c-info'],reported_supplier:['Opgave leverancier','c-info'],estimated:['Geschat','c-warn'],unknown:['Onbekend','c-grey']};
const MANDATE={not_requested:['Geen','c-grey'],pending:['In afwachting','c-warn'],verified:['Geverifieerd','c-ok'],rejected:['Afgewezen','c-bad'],revoked:['Ingetrokken','c-bad']};
const ROLE={admin:'Beheerder',reviewer:'Beoordelaar',viewer:'Alleen-lezen'};
const SCOPE={all:'Alle leads',assigned:'Alleen toegewezen',region:'Regio',organization:'Onderneming'};
const Q=[
 ['brewery_supplier','1. Brouwerij',null],['brewery_supplier_other','   Andere brouwerij',null],
 ['tap_beer_brand','2. Pilsmerk op tap',null],['tap_beer_brand_other','   Ander pilsmerk',null],
 ['distributor','3. Leverancier',{direct:'Rechtstreeks via brouwerij',other:'Anders',unknown:'Weet ik niet'}],['distributor_other','   Andere distributeur',null],['direct_delivery_brewery','   Levert rechtstreeks',null],
 ['keg_size_l','4. Fustformaat (liter)',{other:'Ander formaat',unknown:'Weet ik niet'}],['keg_size_l_other','   Ander fustformaat',null],
 ['keg_price_ex_vat','5. Fustprijs excl. btw (€)',{unknown:'Weet ik niet'}],
 ['annual_volume_hl','6. Afname 2025 (hl)',{unknown:'Weet ik niet'}],
 ['annual_volume_source','7. Bron jaarafname',{own_estimate:'Eigen schatting',invoice:'Zelf opgeteld uit facturen',supplier_statement:'Jaaroverzicht of opgave van de leverancier',unknown:'Weet ik niet'}],
 ['bonus_status','8. Kortingen / bonussen',{yes:'Ja',no:'Nee',unknown:'Weet ik niet'}],
 ['contract_end_status','9. Biercontract',{date_known:'Lopend, einddatum bekend',ongoing:'Lopend, geen vaste einddatum',no_contract:'Geen contract',unknown:'Weet ik niet'}],['contract_end_date','   Einddatum contract',null],
 ['purchase_obligation','10. Afnameverplichting',{yes:'Ja',no:'Nee',unknown:'Weet ik niet'}],
 ['installation_status','11. Tapinstallatie van',{owned:'Eigen zaak',brewery:'Brouwerij / leverancier',leased:'Gehuurd / lease',unknown:'Weet ik niet'}],
 ['brewery_loan_status','12. Lening brouwerij',{yes:'Ja',no:'Nee',unknown:'Weet ik niet'}],
 ['proposal_interest','13. Interesse voorstel',{yes:'Ja, graag een voorstel',maybe:'Misschien, eerst voordeel zien',insight_only:'Alleen inzicht'}],
 ['willingness_to_switch','14. Overstapbereidheid',{yes:'Ja, open voor andere brouwerij',maybe:'Misschien, afhankelijk van aanbod',no:'Nee, huidig merk behouden'}]
];
const ROUTE={mandate:'Machtiging: Horeca United mag opvragen',later_upload:'Later zelf aanleveren',none:'Voorlopig niets delen'};
const SHORT={proposal_interest:{yes:'Ja',maybe:'Misschien',insight_only:'Alleen inzicht'},willingness_to_switch:{yes:'Ja',maybe:'Misschien',no:'Nee'}};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chip=(pair)=>pair?`<span class="chip ${pair[1]}">${esc(pair[0])}</span>`:'';
const fmtDate=d=>d?new Date(d).toLocaleDateString('nl-NL',{day:'numeric',month:'short',year:'numeric'}):'—';
const fmtDT=d=>d?new Date(d).toLocaleString('nl-NL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const fmtHl=n=>n==null||n===''?'—':Number(n).toLocaleString('nl-NL',{maximumFractionDigits:1})+' hl';
const ansLabel=(key,val,map)=>{if(val==null||val==='')return '—';if(map&&map[val])return map[val];return String(val)};
function errText(e){const m=(e&&(e.message||e.error_description||e.details))||String(e);return m.replace(/^.*?ERROR:\s*/,'')}

/* ---------- state ---------- */
const S={user:null,role:null,scope:null,leads:[],staff:[],transitions:[],tab:'leads',sel:null,filters:{q:'',stage:'',hl:'',mandate:''}};

/* ---------- data layer (live = Supabase, demo = fictief) ---------- */
const api=DEMO?demoApi():liveApi();
function liveApi(){
 const ok=({data,error})=>{if(error)throw error;return data};
 return {
  async session(){const {data}=await client.auth.getSession();return data.session?.user??null},
  async myRole(){return ok(await client.rpc('huos_staff_role'))},
  async myStaffRow(uid){return ok(await client.from('huos_staff').select('role,scope,scope_values').eq('user_id',uid).maybeSingle())},
  async leads(){return ok(await client.from('huos_beer_lead_overview').select('*').order('submitted_at',{ascending:false}))},
  async transitions(){return ok(await client.from('huos_beer_stage_transitions').select('*'))},
  async submission(id){return ok(await client.from('huos_beer_intake_submissions').select('answers,data_route,privacy_notice_version,mandate_consent_version,mandate_consent_at,created_at').eq('id',id).single())},
  async notes(lead){return ok(await client.from('huos_beer_lead_notes').select('*').eq('lead_id',lead).order('created_at',{ascending:false}))},
  async verifications(lead){return ok(await client.from('huos_beer_lead_verifications').select('*').eq('lead_id',lead).order('verified_at',{ascending:false}))},
  async mandate(lead){return ok(await client.from('huos_beer_mandates').select('*').eq('lead_id',lead).maybeSingle())},
  async events(lead){return ok(await client.from('huos_beer_lead_events').select('*').eq('lead_id',lead).order('created_at',{ascending:false}).limit(100))},
  async staffList(){return ok(await client.rpc('huos_staff_list'))},
  async staffAudit(){return ok(await client.from('huos_staff_audit').select('*').order('created_at',{ascending:false}).limit(200))},
  async allEvents(){return ok(await client.from('huos_beer_lead_events').select('*').order('created_at',{ascending:false}).limit(200))},
  async setStage(lead,to,note){return ok(await client.rpc('huos_beer_lead_set_stage',{p_lead:lead,p_to:to,p_note:note||null}))},
  async assign(lead,user,follow,prio){return ok(await client.rpc('huos_beer_lead_assign',{p_lead:lead,p_user:user,p_follow_up:follow||null,p_priority:prio||null}))},
  async addNote(lead,body){return ok(await client.rpc('huos_beer_lead_add_note',{p_lead:lead,p_body:body}))},
  async verify(lead,field,year,value,unit,outcome,kind,note){return ok(await client.rpc('huos_beer_lead_verify',{p_lead:lead,p_field:field,p_period_year:year,p_value:value,p_unit:unit,p_outcome:outcome,p_evidence_kind:kind,p_note:note,p_document:null}))},
  async mandateDecide(id,status,method,note,via){return ok(await client.rpc('huos_beer_mandate_decide',{p_mandate:id,p_status:status,p_method:method||null,p_note:note||null,p_revoked_via:via||null}))},
  async beerAlerts(){return ok(await client.from('huos_pilot_beer_scan_alerts').select('*').eq('pending',true).order('changed_at',{ascending:false}))},
  async leadOrgLinks(){return ok(await client.from('huos_beer_leads').select('id,organization_id').not('organization_id','is',null))},
  async linkSuggestions(){return ok(await client.rpc('huos_beer_link_suggestions'))},
  async linkLeadOrg(l,o){return ok(await client.rpc('huos_beer_lead_link_org',{p_lead:l,p_org:o}))},
  async beerAllVersions(){return ok(await client.from('huos_pilot_beer_scan_versions').select('organization_id,completed_at,answers').order('completed_at',{ascending:false}).limit(500))},
  async beerVersions(o){return ok(await client.from('huos_pilot_beer_scan_versions').select('*').eq('organization_id',o).order('completed_at',{ascending:false}).limit(10))},
  async beerSeen(o){return ok(await client.rpc('huos_beer_scan_seen',{p_org:o}))},
  async orgMandate(o){return ok(await client.from('huos_beer_mandates').select('*').eq('organization_id',o).in('status',['pending','verified']).maybeSingle())},
  async orgMandEvents(o){return ok(await client.from('huos_beer_lead_events').select('*').is('lead_id',null).eq('details->>organization_id',o).order('created_at',{ascending:false}).limit(50))},
  async linkOrg(m,o){return ok(await client.rpc('huos_mandate_link_org',{p_mandate:m,p_org:o}))},
  async mandSuppliers(m){return ok(await client.from('huos_beer_mandate_suppliers').select('*').eq('mandate_id',m).order('created_at'))},
  async mandSignatures(m){const sg=ok(await client.from('huos_mandate_signatures').select('id,kind,signed_at,signer_name,signer_function,org_kvk,suppliers,periods,text_version,text_sha256,text_rendered,method,pdf_document_id,pdf_sha256').eq('mandate_id',m).order('signed_at'))||[];const ids=sg.map(g=>g.pdf_document_id).filter(Boolean);const dd=ids.length?(ok(await client.from('huos_pilot_documents').select('id,storage_path,file_name').in('id',ids))||[]):[];const by=Object.fromEntries(dd.map(x=>[x.id,x]));return sg.map(g=>({...g,doc:by[g.pdf_document_id]||null}))},
  async mandPdf(m){const r=await client.functions.invoke('huos-mandate-pdf',{body:{mandate_id:m}});if(r.error){let msg=r.error.message;try{const j=await r.error.context.json();if(j&&j.error)msg=j.error}catch(_){}throw new Error(msg)}return r.data},
  async mandRequests(m){return ok(await client.from('huos_beer_mandate_requests').select('*').eq('mandate_id',m).order('created_at',{ascending:false}))},
  async supAdd(m,name,role,scope,via,note){return ok(await client.rpc('huos_mandate_supplier_add',{p_mandate:m,p_name:name,p_role:role,p_scope:scope,p_confirmed_via:via,p_note:note}))},
  async supUpdate(id,name,scope,check,note){return ok(await client.rpc('huos_mandate_supplier_update',{p_supplier:id,p_name:name||null,p_scope:scope||null,p_name_check:check||null,p_note:note}))},
  async supRevoke(id,reason){return ok(await client.rpc('huos_mandate_supplier_revoke',{p_supplier:id,p_reason:reason}))},
  async reqCreate(sup,channel,scope,note){return ok(await client.rpc('huos_mandate_request_create',{p_supplier:sup,p_channel:channel,p_scope:scope||null,p_note:note||null}))},
  async reqSet(id,status,note,doc){return ok(await client.rpc('huos_mandate_request_set',{p_request:id,p_status:status,p_note:note||null,p_document:doc||null}))},
  async setRole(user,role,scope,values,reason){return ok(await client.rpc('huos_staff_set_role',{p_user:user,p_role:role,p_scope:scope,p_scope_values:values,p_reason:reason}))},

/* ---------- boot ---------- */
async function boot(){
 if(DEMO)$('#demoBanner').hidden=false;
 try{
  S.user=await api.session();
  if(!S.user)return loginGate();
  if(RECOVERY&&!S.pwDone)return passwordView(true);
  if(false)return gate('Log eerst in','Je bent niet ingelogd. Log in via de pilot met je zakelijke e-mailadres en open daarna dit beheerscherm opnieuw.',true);
  S.role=await api.myRole();
  if(!S.role){renderWho();return gate('Geen toegang','Dit account heeft geen interne rol bij Horeca United. Neem contact op met een beheerder als je denkt dat dit niet klopt.',false)}
  const row=await api.myStaffRow(S.user.id);S.scope=row?.scope||null;
  renderWho();
  try{S.recent=await api.recentDocs()||[]}catch(_){S.recent=[]}
  try{S.requests=await api.requests()||[]}catch(_){S.requests=[]}
  try{S.beerAlerts=await api.beerAlerts()||[]}catch(_){S.beerAlerts=[]}
  await loadLinks();
  const [leads,trans]=await Promise.all([api.leads(),api.transitions()]);
  S.leads=leads||[];S.transitions=trans||[];
  if(S.role==='admin'){try{S.staff=await api.staffList()||[]}catch(e){S.staff=[]}}
  render();
 }catch(e){gate('Er ging iets mis',errText(e),false)}
}
function gate(title,text,login){
 $('#app').innerHTML=`<div class="gate card"><h1>${esc(title)}</h1><p>${esc(text)}</p>${login?'<p><a class="btn primary" href="./">Naar inloggen</a></p>':''}</div>`;
}
function renderWho(){
 $('#who').innerHTML=`<span class="hide-m">${esc(S.user?.email||'')}</span> ${S.role?`<span class="role">${esc(ROLE[S.role]||S.role)}</span>`:''} ${DEMO?'':'<button class="btn small" id="pwbtn">Wachtwoord</button> '}<button class="btn small" id="logout">Uitloggen</button>`;
 if($('#pwbtn'))$('#pwbtn').onclick=()=>passwordView(false);
 $('#logout').onclick=async()=>{await api.signOut();if(DEMO)location.reload()};
}
function render(){
 const nNew=newUploads().length;
 const nReq=(S.requests||[]).filter(r=>r.status==='new').length;
 const tabs=[['leads','Leads'+((S.beerAlerts||[]).length?` <span class="badge">${S.beerAlerts.length} bierscan</span>`:'')],['costs','Kosten'+(nNew?` <span class="badge">${nNew} nieuw</span>`:'')],['requests','Aanvragen'+(nReq?` <span class="badge">${nReq} nieuw</span>`:'')]].concat(S.role==='admin'?[['staff','Medewerkers'],['log','Logboek']]:[]);
 $('#app').innerHTML=`<div class="tabs">${tabs.map(([k,v])=>`<button class="tab ${S.tab===k?'on':''}" data-tab="${k}">${v}</button>`).join('')}</div><div id="view"></div>`;
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.sel=null;render()});
 if(S.tab==='leads')renderLeads();else if(S.tab==='costs')renderCosts();else if(S.tab==='requests')renderRequests();else if(S.tab==='staff')renderStaff();else renderLog();
}

/* ---------- Energie-jaarafrekening (elektra / gas) ---------- */
function parseEnergyAnnual(lines,ownName){
 const t=lines.join('\n');if(!/jaarafrekening|jaarnota|eindafrekening/i.test(t)||!/(kwh|m3|m³)/i.test(t))return null;
 const num=x=>Number(String(x).replace(/\./g,'').replace(',','.'));
 const gas=/\b(m3|m³)\b/i.test(t)&&!/\bkwh\b/i.test(t.replace(/omrekenfactor.*kwh/ig,''))||/jaarafrekening\s+gas/i.test(t);
 const comm=gas?'gas':'elektra',unit=gas?'m³':'kWh';
 // totaal excl. btw van het jaar (niet het restant/te betalen)
 let total=null;const tl=lines.find(x=>/totaal\s+(elektriciteit|gas|energie|levering)?\s*(exclusief|excl\.?)\s*btw/i.test(x));if(tl){const m=tl.match(/€\s*(-?[\d.]+,\d{2})/);if(m)total=num(m[1])}
 if(total==null){const jl=lines.find(x=>/^\s*jaarafrekening\s+(elektriciteit|gas)\s+€/i.test(x));if(jl){const m=jl.match(/€\s*(-?[\d.]+,\d{2})/);if(m)total=num(m[1])}}
 if(total==null)return null;
 // periode
 let ps=null,pe=null;const pl=lines.find(x=>/(leverings|afreken|verbruiks)periode/i.test(x));if(pl){const ds=dpDates(pl);if(ds.length>=2){ps=ds[0];pe=ds[1];const st=new Date(ps+'T12:00:00Z'),en=new Date(pe+'T12:00:00Z');if(en.getUTCDate()===st.getUTCDate()){en.setUTCDate(en.getUTCDate()-1);pe=en.toISOString().slice(0,10)}}}
 // verbruik
 let qty=null;const ml=lines.find(x=>/^\s*totaal\s+[\d.]+(?:[.,]\d+)?\s*$/i.test(x));if(ml)qty=Number(ml.replace(/[^\d.,]/g,'').replace(',','.'));
 if(!qty){const eb=lines.filter(x=>/energie\s*belasting/i.test(x)&&new RegExp('\\b(kwh|m3|m³)\\b','i').test(x)).map(x=>Number((x.match(/([\d.]+)\s*(kwh|m3|m³)/i)||[])[1]));if(eb.length)qty=eb.reduce((a,b)=>a+(b||0),0)}
 // onderdelen
 const parts={levering:0,netbeheer:0,belasting:0};let nb=null;
 for(const x of lines){const m=x.match(/^\s*totaal\s+(.+?)\s+€\s*(-?[\d.]+,\d{2})\s*$/i);if(!m)continue;const k=m[1].toLowerCase();
  if(!/^[a-zà-ÿ .()\-]+$/.test(k)||/exclusief|inclusief|btw|te betalen|termijn/.test(k))continue;const v=num(m[2]);
  if(/overheid|energiebelasting|belasting/.test(k))parts.belasting+=v;else if(/netbeheer|transport|aansluit|systeembeheer/.test(k))parts.netbeheer+=v;else parts.levering+=v}
 const nl=lines.find(x=>/netbeheer(kosten)?\s*\(/i.test(x));if(nl)nb=(nl.match(/\(([^)]+)\)/)||[])[1];
 const sum=parts.levering+parts.netbeheer+parts.belasting;const splitOk=sum>0&&Math.abs(sum-total)<1&&parts.levering>0;if(splitOk)parts.levering=Math.round((total-parts.netbeheer-parts.belasting)*100)/100;
 const sup=dpSupplier(lines,ownName||'').supplier;
 const term=(t.match(/termijnbedrag[^€\n]*€\s*([\d.]+,\d{2})/i)||[])[1];
 // verrekening (bijbetalen / terugkrijgen) na aftrek van de voorschotten
 let settle=null;const sl=lines.find(x=>/(restant|te betalen|terug te ontvangen|te ontvangen|tegoed|verrekening)/i.test(x)&&/€/.test(x)&&!/termijnbedrag/i.test(x));
 if(sl){const am=[...sl.matchAll(/€\s*(-?[\d.]+,\d{2})/g)].map(m=>num(m[1]));if(am.length){const v=am[am.length-1];settle={amount:Math.abs(v),refund:v<0||/terug|tegoed|ontvangen/i.test(sl)}}}
 const lastEur=x=>{const am=[...String(x||'').matchAll(/€\s*(-?[\d.]+,\d{2})/g)].map(m=>num(m[1]));return am.length?am[am.length-1]:null};
 const pl2=lines.find(x=>/^\s*(termijnfacturen|voorschotten|betaalde termijnen|reeds gefactureerd)/i.test(x));const paid=pl2!=null?Math.abs(lastEur(pl2)||0)||null:null;
 const il=lines.find(x=>/totaal\s+inclusief\s+btw|totaal\s+incl\.?\s+btw/i.test(x));const totalIncl=il?lastEur(il):null;
 const r={comm,unit,supplier:sup,total,period_start:ps,period_end:pe,qty,parts,netbeheerder:nb?nb.replace(/\s+N\.?V\.?$/,''):null,splitOk,newTerm:term?num(term):null,settle,paid,totalIncl};
 r.allin=qty?total/qty:null;r.levPer=qty&&splitOk?parts.levering/qty:null;return r}

function ptypeGuess(name,cat){const n=String(name||'').toLowerCase(),S1=t=>({t,sure:true});
 if(/papier|servies|glas|porselein|porcelein|huishoud|textiel|elektro|schoonmaak|verzorging|kantoor|bedrijfsbenodig|vrije\s*tijd|luxe artikel|verpakkingsmat|disposable|reinig|afwas|vaatmiddel|cosmetica|handzeep/.test(n))return S1('nonfood');

 if(/zeekraal|lamsoor|lamsoren|zeegroente/.test(n))return S1('agf');
 if(/diepvries|frites|friet/.test(n))return S1('diepvries');
 if(/slager|poelier|vleeswaren|vlees|kip|rund|varken|kalf|lam|steak|tartaar|haas|ribeye|ribfinger|spek|ham|worst|gehakt|buik naturel|nekken|\bnek\b|filet/.test(n))return S1('vlees');
 if(/^agf|groente|fruit|aardappel|salade|kruiden vers|zeekraal|lamsoor|lamsoren|zeegroente/.test(n))return S1('agf');
 if(/zuivel|koeling|kaas|melk|room|boter|yoghurt|eier/.test(n))return S1('zuivel');
 if(/diepvries|frites|friet/.test(n))return S1('diepvries');
 if(/brood|patisserie|banket|gebak|zoetwaren/.test(n))return S1('brood');
 if(/wijn|champagne|cava|prosecco|port\b/.test(n))return S1('wijn');

   show(`<b>${esc(d.file_name)}</b><ul>${typeLine}${costInfo}</ul>${policySummaryHtml(pol)}${contractBtnHtml(docId)}<details style="margin-top:6px"><summary class="hint">Toon uitgelezen tekst</summary>${rawTextHtml(lines)}</details>`);bindContractBtn(docId);bindCopyRaw();return}
  const r=parseInvoice(lines,S.costLines);
  const set=(id,v)=>{if(v==null||v==='')return false;$(id).value=v;$(id).classList.add('auto');return true};
  const got=[];if(r.category&&set('#ccat',r.category))got.push('categorie');$('#ckind').value=kindOfCat($('#ccat').value);setTimeout(()=>setAutoContract(docId),0);if(set('#csup',r.supplier))got.push('leverancier');if(set('#cprod',r.product))got.push('product');
  if(set('#cfrom',r.period_start)&&set('#cto',r.period_end))got.push('periode');if(set('#cidate',r.invoice_date))got.push('factuurdatum');if(set('#cinr',r.invoice_number))got.push('factuurnummer');
  S.pendingSurcharges=r.surcharges&&r.surcharges.length&&r.amount_main!=null?r.surcharges:null;
  if(set('#camt',(S.pendingSurcharges?r.amount_main:r.amount_excl)!=null?(S.pendingSurcharges?r.amount_main:r.amount_excl).toFixed(2):null))got.push(S.pendingSurcharges?'bedrag excl. btw (zonder heffing)':'bedrag excl. btw');if(r.quantity!=null&&set('#cqty',r.quantity)&&set('#cunit',r.unit))got.push('aantal + eenheid');
  const miss=[!r.supplier&&'leverancier',!r.period_start&&'periode',r.amount_excl==null&&'bedrag excl. btw'].filter(Boolean);
  show(`<b>Uitgelezen: ${esc(d.file_name)}</b> — controleer de <span style="background:#fff6e5;border:1px solid #e3a33b;padding:0 4px;border-radius:4px">oranje</span> velden en klik op Opslaan.
   <ul>${typeLine}${got.length?`<li>Gevonden: ${esc(got.join(', '))}</li>`:''}${miss.length?`<li><b>Niet gevonden:</b> ${esc(miss.join(', '))} — vul dit zelf in.</li>`:''}${r.learned?'<li>Leverancier eerder gezien: categorie, product en eenheid overgenomen van de vorige factuur.</li>':''}${r.checks.map(c=>`<li>${esc(c)}</li>`).join('')}${r.warn.map(w=>`<li style="color:var(--bad)">${esc(w)}</li>`).join('')}${S.pendingSurcharges?`<li><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="csplit" checked style="width:auto"> Heffing apart opslaan als eigen kostenregel: ${S.pendingSurcharges.map(x=>esc(x.label)+' '+eur(x.amount)).join(', ')} (subtotaal ${eur(r.amount_excl)})</label></li>`:''}${r.vat!=null?`<li>Btw op factuur: ${eur(r.vat)}${r.amount_incl!=null?' · totaal incl.: '+eur(r.amount_incl):''}</li>`:''}</ul>
   ${chosen==='contract'?contractBtnHtml(docId):''}
   <details style="margin-top:6px"><summary class="hint">Toon uitgelezen tekst</summary>${rawTextHtml(lines)}</details>`);
  S.lastLines=lines;bindContractBtn(docId);bindCopyRaw();
 }catch(e){show('<b>Uitlezen mislukt:</b> '+esc(errText(e))+'. Vul de gegevens handmatig in; de factuur is al gekoppeld.')}
 finally{if(btn){btn.disabled=false;btn.textContent='Uitlezen → formulier'}}
}

/* ---------- Medewerkers ---------- */
async function renderStaff(){
 $('#view').innerHTML='<p class="hint">Laden…</p>';
 try{
  const [list,audit]=await Promise.all([api.staffList(),api.staffAudit()]);S.staff=list||[];
  $('#view').innerHTML=`<h1>Medewerkers en rechten</h1><p class="sub">Alleen beheerders zien deze pagina. Rollen kunnen alleen aan bevestigde @horecaunited.nl-accounts worden gegeven; elke wijziging wordt gelogd.</p>
  <div class="card" style="overflow:auto"><table><thead><tr><th>Account</th><th>Rol</th><th>Bereik</th><th>Status</th><th class="hide-m">Laatst ingelogd</th><th></th></tr></thead><tbody>
  ${S.staff.map(s=>`<tr style="cursor:default"><td>${esc(s.email)}${s.user_id===S.user.id?' <span class="chip c-info">jij</span>':''}</td><td>${esc(ROLE[s.role]||s.role)}</td><td>${esc(SCOPE[s.scope]||s.scope)}${(s.scope_values||[]).length?': '+esc(s.scope_values.join(', ')):''}</td><td>${s.active?chip(['Actief','c-ok']):chip(['Ingetrokken','c-grey'])}</td><td class="hide-m">${fmtDT(s.last_sign_in_at)}</td><td>${s.active&&s.user_id!==S.user.id?`<button class="btn small" data-rev="${esc(s.user_id)}">Intrekken</button>`:''}</td></tr>`).join('')}
  </tbody></table></div>
  <h3>Rol toekennen of wijzigen</h3><div class="card" style="padding:16px"><div class="form">
   <p class="hint">Het account moet eerst bestaan (uitnodigen via Supabase → Authentication → Invite user) en één keer zijn ingelogd. Vul het gebruikers-ID in uit Supabase.</p>
   <div class="row"><input id="ruid" placeholder="Gebruikers-ID (uuid)"><select id="rrole"><option value="viewer">Alleen-lezen</option><option value="reviewer">Beoordelaar</option><option value="admin">Beheerder</option></select><select id="rscope"><option value="assigned">Alleen toegewezen leads</option><option value="all">Alle leads</option><option value="region">Regio</option></select><input id="rvals" placeholder="Regio's (komma-gescheiden)"></div>
   <input id="rreason" placeholder="Reden (verplicht, komt in het logboek)"><button class="btn primary" id="rgo">Opslaan</button><div class="msg" id="rmsg"></div></div></div>
  <h3>Logboek rechten</h3><div class="card"><ul class="timeline" style="padding:0 16px">${(audit||[]).map(a=>`<li><span>${fmtDT(a.created_at)} · door ${a.actor_kind==='database'?'database/migratie':esc(staffEmail(a.actor_id))}</span>${esc(a.action)} — ${esc(staffEmail(a.target_user))}: ${esc(a.old_value?(a.old_value.role+'/'+a.old_value.scope+' → '):'')}${esc(a.new_value?(a.new_value.role+'/'+a.new_value.scope):'')}${a.reason?' — '+esc(a.reason):''}</li>`).join('')||'<li>Geen regels.</li>'}</ul></div>`;
  document.querySelectorAll('[data-rev]').forEach(b=>b.onclick=async()=>{const reason=prompt('Reden voor intrekken (verplicht):');if(!reason)return;try{await api.revoke(b.dataset.rev,reason);renderStaff()}catch(e){alert(errText(e))}});
  $('#rgo').onclick=async()=>{const m=$('#rmsg');m.className='msg';try{const vals=$('#rvals').value.split(',').map(x=>x.trim()).filter(Boolean);await api.setRole($('#ruid').value.trim(),$('#rrole').value,$('#rscope').value,$('#rscope').value==='region'?vals:[],$('#rreason').value.trim());m.className='msg ok';m.textContent='Opgeslagen.';renderStaff()}catch(e){m.className='msg err';m.textContent=errText(e)}};
 }catch(e){$('#view').innerHTML=`<p class="msg err">${esc(errText(e))}</p>`}
}
function staffEmail(uid){const s=S.staff.find(x=>x.user_id===uid);return s?s.email:(uid?uid.slice(0,8)+'…':'—')}

/* ---------- Logboek ---------- */
async function renderLog(){
 $('#view').innerHTML='<p class="hint">Laden…</p>';
 try{const evs=await api.allEvents();const name=id=>(S.leads.find(l=>l.lead_id===id)||{}).company_name||'—';
  $('#view').innerHTML=`<h1>Logboek leads</h1><p class="sub">Alle acties op leads, inclusief exports. Dit logboek kan niet worden gewijzigd of gewist.</p>
  <div class="card"><table><thead><tr><th>Wanneer</th><th>Wie</th><th>Lead</th><th>Actie</th></tr></thead><tbody>${(evs||[]).map(e=>`<tr style="cursor:default"><td>${fmtDT(e.created_at)}</td><td>${e.actor_id?esc(staffEmail(e.actor_id)):'systeem'}</td><td>${e.lead_id?esc(name(e.lead_id)):'—'}</td><td>${esc(eventText(e))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Geen gebeurtenissen.</td></tr>'}</tbody></table></div>`;
 }catch(e){$('#view').innerHTML=`<p class="msg err">${esc(errText(e))}</p>`}
}

function loginGate(msg){
 $('#who').innerHTML='';
 $('#app').innerHTML=`<div class="gate card"><h1>Inloggen beheer</h1><p>Log in met je zakelijke e-mailadres van Horeca United. Deze inlog staat los van de klantomgeving: je kunt in een ander tabblad als testklant ingelogd blijven.</p>
 <div class="form" style="text-align:left"><input id="lemail" type="email" autocomplete="username" placeholder="naam@horecaunited.nl"><input id="lpw" type="password" autocomplete="current-password" placeholder="Wachtwoord"><button class="btn primary" id="lgo">Inloggen</button><div class="msg" id="lmsg">${msg?esc(msg):''}</div></div>
 <p class="hint"><a href="#" id="lreset">Wachtwoord instellen of vergeten?</a> · <a href="#" id="lmagic">Liever een inloglink per e-mail</a></p></div>`;
 const m=$('#lmsg');
 const mail=()=>{const e=$('#lemail').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){m.className='msg err';m.textContent='Vul eerst een geldig e-mailadres in.';return null}return e};
 const flag=()=>{try{localStorage.setItem('huos-login-target',JSON.stringify({to:'beheer',ts:Date.now()}))}catch(_){}};
 const busy=async(fn)=>{m.className='msg';m.textContent='Bezig…';$('#lgo').disabled=true;try{await fn()}catch(e){m.className='msg err';m.textContent=errText(e)}finally{const b=$('#lgo');if(b)b.disabled=false}};
 const login=()=>{const e=mail();if(!e)return;const pw=$('#lpw').value;if(!pw){m.className='msg err';m.textContent='Vul je wachtwoord in.';return}
  if(DEMO){m.className='msg err';m.textContent='Demo: inloggen is uitgeschakeld.';return}
  busy(async()=>{const {error}=await client.auth.signInWithPassword({email:e,password:pw});if(error)throw new Error(/invalid login/i.test(error.message)?'E-mailadres of wachtwoord klopt niet. Nog geen wachtwoord? Klik op "Wachtwoord instellen of vergeten?".':error.message);S.user=null;await boot()})};
 $('#lgo').onclick=login;$('#lpw').onkeydown=ev=>{if(ev.key==='Enter')login()};$('#lemail').onkeydown=ev=>{if(ev.key==='Enter')$('#lpw').focus()};
 $('#lreset').onclick=ev=>{ev.preventDefault();const e=mail();if(!e||DEMO)return;busy(async()=>{flag();const {error}=await client.auth.resetPasswordForEmail(e,{redirectTo:AUTH_REDIRECT});if(error)throw error;m.className='msg ok';m.textContent='Als dit account bestaat, is er een e-mail verstuurd om je wachtwoord in te stellen. Open de link in deze browser (kijk ook in je spammap).'})};
 $('#lmagic').onclick=ev=>{ev.preventDefault();const e=mail();if(!e||DEMO)return;busy(async()=>{flag();const {error}=await client.auth.signInWithOtp({email:e,options:{emailRedirectTo:AUTH_REDIRECT,shouldCreateUser:false}});if(error)throw error;m.className='msg ok';m.textContent='De inloglink is verstuurd. Open de nieuwste e-mail in deze browser.'})};
}
function passwordView(recovery){
 $('#app').innerHTML=`<div class="gate card"><h1>${recovery?'Nieuw wachtwoord instellen':'Wachtwoord wijzigen'}</h1><p>Kies een sterk wachtwoord van minimaal 12 tekens dat je nergens anders gebruikt. Bewaar het bij voorkeur in een wachtwoordmanager.</p>
 <div class="form" style="text-align:left"><input id="pw1" type="password" autocomplete="new-password" placeholder="Nieuw wachtwoord (min. 12 tekens)"><input id="pw2" type="password" autocomplete="new-password" placeholder="Herhaal wachtwoord"><button class="btn primary" id="pwgo">Wachtwoord opslaan</button>${recovery?'':'<button class="btn" id="pwcancel">Annuleren</button>'}<div class="msg" id="pwmsg"></div></div></div>`;
 if($('#pwcancel'))$('#pwcancel').onclick=()=>render();
 $('#pwgo').onclick=async()=>{const m=$('#pwmsg'),a=$('#pw1').value,b=$('#pw2').value;m.className='msg err';
  if(a.length<12)return m.textContent='Gebruik minimaal 12 tekens.';if(a!==b)return m.textContent='De wachtwoorden zijn niet gelijk.';
  if(DEMO)return m.textContent='Demo: er wordt niets opgeslagen.';
  $('#pwgo').disabled=true;m.className='msg';m.textContent='Bezig…';
  try{const {error}=await client.auth.updateUser({password:a});if(error)throw error;S.pwDone=true;history.replaceState(null,'',location.pathname);m.className='msg ok';m.textContent='Wachtwoord opgeslagen. Voortaan log je in met e-mail en wachtwoord.';setTimeout(()=>{S.user=null;boot()},1200)}
  catch(e){m.className='msg err';m.textContent=errText(e);$('#pwgo').disabled=false}};
}
if(client)client.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){S.user=null;S.role=null;S.orgs=null;loginGate()}else if(ev==='PASSWORD_RECOVERY'){setTimeout(()=>passwordView(true),0)}else if(ev==='SIGNED_IN'&&!S.user&&!RECOVERY){setTimeout(boot,0)}});
boot();

// Getalvelden: scrollen met het muiswiel mag de waarde niet ongemerkt veranderen
document.addEventListener('wheel',e=>{const a=document.activeElement;if(a&&a.type==='number'&&e.target===a)a.blur()},{passive:true});
</script>
