<style>
:root{--dark:#12392b;--green:#317b55;--light:#e7f4e8;--cream:#f7f9f6;--text:#17382a;--muted:#6b8976;--border:#e2eae3;

*{box-sizing:border-box}body{margin:0;font-family:var(--body);background:var(--cream);color:var(--text);font-size:14px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.demo-banner{background:#fff4d6;color:#6b4e00;text-align:center;font-size:12px;padding:7px 12px;border-bottom:1px solid #f0dfa8}
header{background:#fff;border-bottom:1px solid var(--border)}
.hdr{max-width:1320px;margin:auto;padding:0 24px;min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:11px;font-weight:700;text-decoration:none;color:var(--text)}
.logo b{width:40px;height:40px;border-radius:11px;background:var(--dark);color:#fff;display:flex;align-items:center;justify-content:center;font:600 14px var(--mono)}
.logo small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.who{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.role{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;background:var(--light);color:var(--green);padding:4px 8px;border-radius:6px}
.btn{border:1px solid var(--border);background:#fff;color:var(--text);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:500}
.btn:hover{border-color:#c6d6c9}.btn.primary{background:var(--dark);border-color:var(--dark);color:#fff}.btn.primary:hover{background:#0d2c21}
.btn.small{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
main{max-width:1320px;margin:auto;padding:22px 24px 60px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px}
.tab{background:none;border:none;padding:11px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--text);border-color:var(--dark)}
h1{font:600 26px var(--display);margin:0 0 4px}h2{font:600 19px var(--display);margin:0 0 12px}h3{font-size:13px;margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.stat span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat b{display:block;font:600 24px var(--display);margin-top:4px}.stat small{color:var(--muted);font-size:11px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters input,.filters select,.form input,.form select,.form textarea{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff;color:var(--text)}
.filters input{min-width:240px}
.card{background:#fff;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #eef2ee;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:#fbfcfb;position:sticky;top:0}
tbody tr{cursor:pointer}tbody tr:hover{background:#f6faf6}tbody tr.sel{background:#eef6ef}
td .s{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-info{background:var(--infobg);color:var(--info)}.c-bad{background:var(--badbg);color:var(--bad)}.c-grey{background:var(--greybg);color:var(--grey)}
.empty{padding:40px;text-align:center;color:var(--muted)}
.layout{display:grid;grid-template-columns:1fr;gap:18px}
.layout.open{grid-template-columns:minmax(0,1fr) 520px}
.detail{padding:20px;align-self:start;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.detail .close{float:right}
.two{display:grid;grid-template-columns:1fr;gap:6px}
.kv{display:grid;grid-template-columns:44% 56%;gap:8px;padding:7px 0;border-bottom:1px dashed #edf1ed;font-size:13px}
.kv span{color:var(--muted)}.kv b{font-weight:500;word-break:break-word}
.box{border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:10px;background:#fcfdfc}
.box.orig{border-left:3px solid #9fb8a6}.box.int{border-left:3px solid var(--dark)}
.form{display:grid;gap:8px;margin-top:8px}.form .row{display:flex;gap:8px;flex-wrap:wrap}.form .row>*{flex:1;min-width:120px}
.form textarea{min-height:60px;resize:vertical}
.msg{font-size:12px;margin-top:6px;min-height:16px}.badge{display:inline-block;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px;font-weight:600;vertical-align:1px}.newbox{border:1px solid #e3a33b;background:#fffaf0;border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:13px}.newbox li{margin:3px 0}.auto{background:#fff6e5!important;border-color:#e3a33b!important}.xbox{border:1px solid #e3d3a8;background:#fffaf0;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:8px}.xbox ul{margin:6px 0 0 18px;padding:0}.xbox pre{white-space:pre-wrap;font-size:11px;max-height:220px;overflow:auto;background:#fff;border:1px solid var(--line,#e3e0d5);padding:8px;border-radius:6px}.doclist li{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}
.timeline{list-style:none;margin:0;padding:0}.timeline li{padding:8px 0;border-bottom:1px solid #eef2ee;font-size:12px}.timeline li span{color:var(--muted);display:block}
.note{padding:9px 0;border-bottom:1px solid #eef2ee;font-size:13px;white-space:pre-wrap}.note span{display:block;color:var(--muted);font-size:11px;margin-bottom:3px}
.gate a{color:var(--dark);font-weight:500}.gate{max-width:520px;margin:60px auto;text-align:center;padding:34px}.gate p{color:var(--muted);line-height:1.6}
.hint{font-size:12px;color:var(--muted)}
.num{text-align:right;white-space:nowrap}.pct-up{color:var(--bad);font-weight:600}.pct-mid{color:var(--warn);font-weight:600}.pct-down{color:var(--ok);font-weight:600}
.sig{border-left:3px solid var(--bad);background:#fff;padding:10px 14px;border-radius:10px;margin:8px 0;font-size:13px}.sig b{display:block;margin-bottom:2px}.sig .s{display:block;margin-top:4px}.form label.hint{display:flex;flex-direction:column;gap:4px}.form label.hint input{width:100%}.orgpick select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;font:inherit}
.orgpick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 16px}.orgpick select{min-width:280px}
@media(max-width:1100px){.layout.open{grid-template-columns:1fr}.detail{position:static;max-height:none}}
@media(max-width:700px){.hide-m{display:none}.filters input{min-width:0;flex:1}}
</style>

 };

async function boot(){
 if(DEMO)$('#demoBanner').hidden=false;
 try{
  S.user=await api.session();
  if(!S.user)return loginGate();
  if(RECOVERY&&!S.pwDone)return passwordView(true);
  if(false)return gate('Log eerst in','Je bent niet ingelogd. Log in via de pilot met je zakelijke e-mailadres en open daarna dit beheerscherm opnieuw.',true);
  S.role=await api.myRole();
  if(!S.role){renderWho();return gate('Geen toegang','Dit account heeft geen interne rol bij Horeca United. Neem contact op met een beheerder als je denkt dat dit niet klopt.',false)}
  const row=await api.myStaffRow(S.user.id);S.scope=row?.scope||null;
  renderWho();
  try{S.recent=await api.recentDocs()||[]}catch(_){S.recent=[]}
  try{S.requests=await api.requests()||[]}catch(_){S.requests=[]}
  const [leads,trans]=await Promise.all([api.leads(),api.transitions()]);
  S.leads=leads||[];S.transitions=trans||[];
  if(S.role==='admin'){try{S.staff=await api.staffList()||[]}catch(e){S.staff=[]}}
  render();
 }catch(e){gate('Er ging iets mis',errText(e),false)}
}

const DP_PDFJS='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/';
let dpPdfLib=null;
async function dpLoadPdf(){if(dpPdfLib)return dpPdfLib;const m=await import(DP_PDFJS+'pdf.min.mjs');m.GlobalWorkerOptions.workerSrc=DP_PDFJS+'pdf.worker.min.mjs';return dpPdfLib=m}
async function dpPdfLines(buf){
 const lib=await dpLoadPdf();const doc=await lib.getDocument({data:buf,isEvalSupported:false,disableFontFace:true}).promise;const out=[];
 for(let p=1;p<=Math.min(doc.numPages,8);p++){const tc=await (await doc.getPage(p)).getTextContent();const rows=new Map();
  for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=Math.round(it.transform[5]/3)*3;if(!rows.has(y))rows.set(y,[]);rows.get(y).push(it)}
  [...rows.keys()].sort((a,b)=>b-a).forEach(y=>out.push(rows.get(y).sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str.trim()).join('  ').replace(/\s{3,}/g,'  ')))}

  const g=guessDocType(lines),chosen=d.category;
  const typeLine=g.type?(g.type===chosen?`<li>Soort document: lijkt ${g.label} (${esc(g.why)} gevonden) ✓ klopt met het label van de klant.</li>`:`<li style="color:var(--warn)"><b>Soort document: lijkt ${g.label}</b> (${esc(g.why)} gevonden), maar de klant koos "${esc(DOCCAT[chosen]||chosen||'onbekend')}".${g.type==='contract'?' Een contract hoort niet in de kostenregels: zet het hieronder bij Mijn contracten van de klant.':''}</li>`):'<li>Soort document: niet duidelijk uit de tekst.</li>';
  if(g.type==='contract'){S.lastLines=lines;show(`<b>${esc(d.file_name)}</b><ul>${typeLine}</ul>${contractBtnHtml(docId)}<details style="margin-top:6px"><summary class="hint">Toon uitgelezen tekst</summary><pre>${esc(lines.join('\n').slice(0,6000))}</pre></details>`);bindContractBtn(docId);return}
  const r=parseInvoice(lines,S.costLines);
  const set=(id,v)=>{if(v==null||v==='')return false;$(id).value=v;$(id).classList.add('auto');return true};
  const got=[];if(r.category&&set('#ccat',r.category))got.push('categorie');if(set('#csup',r.supplier))got.push('leverancier');if(set('#cprod',r.product))got.push('product');
  if(set('#cfrom',r.period_start)&&set('#cto',r.period_end))got.push('periode');if(set('#cidate',r.invoice_date))got.push('factuurdatum');if(set('#cinr',r.invoice_number))got.push('factuurnummer');
  if(set('#camt',r.amount_excl!=null?r.amount_excl.toFixed(2):null))got.push('bedrag excl. btw');if(r.quantity!=null&&set('#cqty',r.quantity)&&set('#cunit',r.unit))got.push('aantal + eenheid');
  const miss=[!r.supplier&&'leverancier',!r.period_start&&'periode',r.amount_excl==null&&'bedrag excl. btw'].filter(Boolean);
  show(`<b>Uitgelezen: ${esc(d.file_name)}</b> — controleer de <span style="background:#fff6e5;border:1px solid #e3a33b;padding:0 4px;border-radius:4px">oranje</span> velden en klik op Opslaan.
   <ul>${typeLine}${got.length?`<li>Gevonden: ${esc(got.join(', '))}</li>`:''}${miss.length?`<li><b>Niet gevonden:</b> ${esc(miss.join(', '))} — vul dit zelf in.</li>`:''}${r.learned?'<li>Leverancier eerder gezien: categorie, product en eenheid overgenomen van de vorige factuur.</li>':''}${r.checks.map(c=>`<li>${esc(c)}</li>`).join('')}${r.warn.map(w=>`<li style="color:var(--bad)">${esc(w)}</li>`).join('')}${r.vat!=null?`<li>Btw op factuur: ${eur(r.vat)}${r.amount_incl!=null?' · totaal incl.: '+eur(r.amount_incl):''}</li>`:''}</ul>
   ${chosen==='contract'?contractBtnHtml(docId):''}
   <details style="margin-top:6px"><summary class="hint">Toon uitgelezen tekst</summary><pre>${esc(lines.join('\n').slice(0,6000))}</pre></details>`);
  S.lastLines=lines;bindContractBtn(docId);
 }catch(e){show('<b>Uitlezen mislukt:</b> '+esc(errText(e))+'. Vul de gegevens handmatig in; de factuur is al gekoppeld.')}
 finally{if(btn){btn.disabled=false;btn.textContent='Uitlezen → formulier'}}
}
const DEMO_INVOICE=['Renewi Nederland B.V.','Postbus 123, 3500 AA Utrecht · KvK 12345678 · BTW NL001234567B01',"Restaurant 't Volk  Factuurnummer: R-2026-1012",'Arnhem  Factuurdatum: 04-11-2026','Periode: 01-10-2026 t/m 31-10-2026','Omschrijving  Aantal  Prijs  Bedrag','Lediging restafval container 240L  4 ledigingen  € 44,00  € 176,00','Totaal excl. btw  € 176,00','Btw 21%  € 36,96','Totaal incl. btw  € 212,96'];

/* ---------- Medewerkers ---------- */
async function renderStaff(){
 $('#view').innerHTML='<p class="hint">Laden…</p>';
 try{
  const [list,audit]=await Promise.all([api.staffList(),api.staffAudit()]);S.staff=list||[];
  $('#view').innerHTML=`<h1>Medewerkers en rechten</h1><p class="sub">Alleen beheerders zien deze pagina. Rollen kunnen alleen aan bevestigde @horecaunited.nl-accounts worden gegeven; elke wijziging wordt gelogd.</p>
  <div class="card" style="overflow:auto"><table><thead><tr><th>Account</th><th>Rol</th><th>Bereik</th><th>Status</th><th class="hide-m">Laatst ingelogd</th><th></th></tr></thead><tbody>
  ${S.staff.map(s=>`<tr style="cursor:default"><td>${esc(s.email)}${s.user_id===S.user.id?' <span class="chip c-info">jij</span>':''}</td><td>${esc(ROLE[s.role]||s.role)}</td><td>${esc(SCOPE[s.scope]||s.scope)}${(s.scope_values||[]).length?': '+esc(s.scope_values.join(', ')):''}</td><td>${s.active?chip(['Actief','c-ok']):chip(['Ingetrokken','c-grey'])}</td><td class="hide-m">${fmtDT(s.last_sign_in_at)}</td><td>${s.active&&s.user_id!==S.user.id?`<button class="btn small" data-rev="${esc(s.user_id)}">Intrekken</button>`:''}</td></tr>`).join('')}
  </tbody></table></div>
  <h3>Rol toekennen of wijzigen</h3><div class="card" style="padding:16px"><div class="form">
   <p class="hint">Het account moet eerst bestaan (uitnodigen via Supabase → Authentication → Invite user) en één keer zijn ingelogd. Vul het gebruikers-ID in uit Supabase.</p>
   <div class="row"><input id="ruid" placeholder="Gebruikers-ID (uuid)"><select id="rrole"><option value="viewer">Alleen-lezen</option><option value="reviewer">Beoordelaar</option><option value="admin">Beheerder</option></select><select id="rscope"><option value="assigned">Alleen toegewezen leads</option><option value="all">Alle leads</option><option value="region">Regio</option></select><input id="rvals" placeholder="Regio's (komma-gescheiden)"></div>
   <input id="rreason" placeholder="Reden (verplicht, komt in het logboek)"><button class="btn primary" id="rgo">Opslaan</button><div class="msg" id="rmsg"></div></div></div>
  <h3>Logboek rechten</h3><div class="card"><ul class="timeline" style="padding:0 16px">${(audit||[]).map(a=>`<li><span>${fmtDT(a.created_at)} · door ${a.actor_kind==='database'?'database/migratie':esc(staffEmail(a.actor_id))}</span>${esc(a.action)} — ${esc(staffEmail(a.target_user))}: ${esc(a.old_value?(a.old_value.role+'/'+a.old_value.scope+' → '):'')}${esc(a.new_value?(a.new_value.role+'/'+a.new_value.scope):'')}${a.reason?' — '+esc(a.reason):''}</li>`).join('')||'<li>Geen regels.</li>'}</ul></div>`;
  document.querySelectorAll('[data-rev]').forEach(b=>b.onclick=async()=>{const reason=prompt('Reden voor intrekken (verplicht):');if(!reason)return;try{await api.revoke(b.dataset.rev,reason);renderStaff()}catch(e){alert(errText(e))}});
  $('#rgo').onclick=async()=>{const m=$('#rmsg');m.className='msg';try{const vals=$('#rvals').value.split(',').map(x=>x.trim()).filter(Boolean);await api.setRole($('#ruid').value.trim(),$('#rrole').value,$('#rscope').value,$('#rscope').value==='region'?vals:[],$('#rreason').value.trim());m.className='msg ok';m.textContent='Opgeslagen.';renderStaff()}catch(e){m.className='msg err';m.textContent=errText(e)}};
 }catch(e){$('#view').innerHTML=`<p class="msg err">${esc(errText(e))}</p>`}
}
function staffEmail(uid){const s=S.staff.find(x=>x.user_id===uid);return s?s.email:(uid?uid.slice(0,8)+'…':'—')}

/* ---------- Logboek ---------- */
async function renderLog(){
 $('#view').innerHTML='<p class="hint">Laden…</p>';
 try{const evs=await api.allEvents();const name=id=>(S.leads.find(l=>l.lead_id===id)||{}).company_name||'—';
  $('#view').innerHTML=`<h1>Logboek leads</h1><p class="sub">Alle acties op leads, inclusief exports. Dit logboek kan niet worden gewijzigd of gewist.</p>
  <div class="card"><table><thead><tr><th>Wanneer</th><th>Wie</th><th>Lead</th><th>Actie</th></tr></thead><tbody>${(evs||[]).map(e=>`<tr style="cursor:default"><td>${fmtDT(e.created_at)}</td><td>${e.actor_id?esc(staffEmail(e.actor_id)):'systeem'}</td><td>${e.lead_id?esc(name(e.lead_id)):'—'}</td><td>${esc(eventText(e))}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Geen gebeurtenissen.</td></tr>'}</tbody></table></div>`;
 }catch(e){$('#view').innerHTML=`<p class="msg err">${esc(errText(e))}</p>`}
}

function loginGate(msg){
 $('#who').innerHTML='';
 $('#app').innerHTML=`<div class="gate card"><h1>Inloggen beheer</h1><p>Log in met je zakelijke e-mailadres van Horeca United. Deze inlog staat los van de klantomgeving: je kunt in een ander tabblad als testklant ingelogd blijven.</p>
 <div class="form" style="text-align:left"><input id="lemail" type="email" autocomplete="username" placeholder="naam@horecaunited.nl"><input id="lpw" type="password" autocomplete="current-password" placeholder="Wachtwoord"><button class="btn primary" id="lgo">Inloggen</button><div class="msg" id="lmsg">${msg?esc(msg):''}</div></div>
 <p class="hint"><a href="#" id="lreset">Wachtwoord instellen of vergeten?</a> · <a href="#" id="lmagic">Liever een inloglink per e-mail</a></p></div>`;
 const m=$('#lmsg');
 const mail=()=>{const e=$('#lemail').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){m.className='msg err';m.textContent='Vul eerst een geldig e-mailadres in.';return null}return e};
 const flag=()=>{try{localStorage.setItem('huos-login-target',JSON.stringify({to:'beheer',ts:Date.now()}))}catch(_){}};
 const busy=async(fn)=>{m.className='msg';m.textContent='Bezig…';$('#lgo').disabled=true;try{await fn()}catch(e){m.className='msg err';m.textContent=errText(e)}finally{const b=$('#lgo');if(b)b.disabled=false}};
 const login=()=>{const e=mail();if(!e)return;const pw=$('#lpw').value;if(!pw){m.className='msg err';m.textContent='Vul je wachtwoord in.';return}
  if(DEMO){m.className='msg err';m.textContent='Demo: inloggen is uitgeschakeld.';return}
  busy(async()=>{const {error}=await client.auth.signInWithPassword({email:e,password:pw});if(error)throw new Error(/invalid login/i.test(error.message)?'E-mailadres of wachtwoord klopt niet. Nog geen wachtwoord? Klik op "Wachtwoord instellen of vergeten?".':error.message);S.user=null;await boot()})};
 $('#lgo').onclick=login;$('#lpw').onkeydown=ev=>{if(ev.key==='Enter')login()};$('#lemail').onkeydown=ev=>{if(ev.key==='Enter')$('#lpw').focus()};
 $('#lreset').onclick=ev=>{ev.preventDefault();const e=mail();if(!e||DEMO)return;busy(async()=>{flag();const {error}=await client.auth.resetPasswordForEmail(e,{redirectTo:AUTH_REDIRECT});if(error)throw error;m.className='msg ok';m.textContent='Als dit account bestaat, is er een e-mail verstuurd om je wachtwoord in te stellen. Open de link in deze browser (kijk ook in je spammap).'})};
 $('#lmagic').onclick=ev=>{ev.preventDefault();const e=mail();if(!e||DEMO)return;busy(async()=>{flag();const {error}=await client.auth.signInWithOtp({email:e,options:{emailRedirectTo:AUTH_REDIRECT,shouldCreateUser:false}});if(error)throw error;m.className='msg ok';m.textContent='De inloglink is verstuurd. Open de nieuwste e-mail in deze browser.'})};
}
function passwordView(recovery){
 $('#app').innerHTML=`<div class="gate card"><h1>${recovery?'Nieuw wachtwoord instellen':'Wachtwoord wijzigen'}</h1><p>Kies een sterk wachtwoord van minimaal 12 tekens dat je nergens anders gebruikt. Bewaar het bij voorkeur in een wachtwoordmanager.</p>
 <div class="form" style="text-align:left"><input id="pw1" type="password" autocomplete="new-password" placeholder="Nieuw wachtwoord (min. 12 tekens)"><input id="pw2" type="password" autocomplete="new-password" placeholder="Herhaal wachtwoord"><button class="btn primary" id="pwgo">Wachtwoord opslaan</button>${recovery?'':'<button class="btn" id="pwcancel">Annuleren</button>'}<div class="msg" id="pwmsg"></div></div></div>`;
 if($('#pwcancel'))$('#pwcancel').onclick=()=>render();
 $('#pwgo').onclick=async()=>{const m=$('#pwmsg'),a=$('#pw1').value,b=$('#pw2').value;m.className='msg err';
  if(a.length<12)return m.textContent='Gebruik minimaal 12 tekens.';if(a!==b)return m.textContent='De wachtwoorden zijn niet gelijk.';
  if(DEMO)return m.textContent='Demo: er wordt niets opgeslagen.';
  $('#pwgo').disabled=true;m.className='msg';m.textContent='Bezig…';
  try{const {error}=await client.auth.updateUser({password:a});if(error)throw error;S.pwDone=true;history.replaceState(null,'',location.pathname);m.className='msg ok';m.textContent='Wachtwoord opgeslagen. Voortaan log je in met e-mail en wachtwoord.';setTimeout(()=>{S.user=null;boot()},1200)}
  catch(e){m.className='msg err';m.textContent=errText(e);$('#pwgo').disabled=false}};
}
if(client)client.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT'){S.user=null;S.role=null;S.orgs=null;loginGate()}else if(ev==='PASSWORD_RECOVERY'){setTimeout(()=>passwordView(true),0)}else if(ev==='SIGNED_IN'&&!S.user&&!RECOVERY){setTimeout(boot,0)}});
boot();
</script>
