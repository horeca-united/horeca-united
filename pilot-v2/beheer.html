.role{font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;background:var(--light);color:var(--green);padding:4px 8px;border-radius:6px}

  async staffAudit(){return [{created_at:d(0),action:'granted',target_user:me,actor_kind:'database',new_value:{role:'admin',scope:'all'},reason:'Eerste hoofdbeheerder (demo)'}]},
  async allEvents(){return ev('l2')},
  setStage:demoOnly,assign:demoOnly,addNote:demoOnly,verify:demoOnly,mandateDecide:demoOnly,setRole:demoOnly,revoke:demoOnly,
  async exportLeads(){return L},async signOut(){location.reload()}
 };
}

/* ---------- boot ---------- */
async function boot(){
 if(DEMO)$('#demoBanner').hidden=false;
 try{
  S.user=await api.session();
  if(!S.user)return gate('Log eerst in','Je bent niet ingelogd. Log in via de pilot met je zakelijke e-mailadres en open daarna dit beheerscherm opnieuw.',true);
  S.role=await api.myRole();
  if(!S.role){renderWho();return gate('Geen toegang','Dit account heeft geen interne rol bij Horeca United. Neem contact op met een beheerder als je denkt dat dit niet klopt.',false)}
  const row=await api.myStaffRow(S.user.id);S.scope=row?.scope||null;
  renderWho();
  const [leads,trans]=await Promise.all([api.leads(),api.transitions()]);
  S.leads=leads||[];S.transitions=trans||[];
  if(S.role==='admin'){try{S.staff=await api.staffList()||[]}catch(e){S.staff=[]}}
  render();
 }catch(e){gate('Er ging iets mis',errText(e),false)}
}
function gate(title,text,login){
 $('#app').innerHTML=`<div class="gate card"><h1>${esc(title)}</h1><p>${esc(text)}</p>${login?'<p><a class="btn primary" href="./">Naar inloggen</a></p>':''}</div>`;
}
function renderWho(){
 $('#who').innerHTML=`<span class="hide-m">${esc(S.user?.email||'')}</span> ${S.role?`<span class="role">${esc(ROLE[S.role]||S.role)}</span>`:''} <button class="btn small" id="logout">Uitloggen</button>`;
 $('#logout').onclick=async()=>{await api.signOut();location.href='./'};
}
function render(){
 const tabs=[['leads','Leads']].concat(S.role==='admin'?[['staff','Medewerkers'],['log','Logboek']]:[]);
 $('#app').innerHTML=`<div class="tabs">${tabs.map(([k,v])=>`<button class="tab ${S.tab===k?'on':''}" data-tab="${k}">${v}</button>`).join('')}</div><div id="view"></div>`;
 document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.sel=null;render()});
 if(S.tab==='leads')renderLeads();else if(S.tab==='staff')renderStaff();else renderLog();
}

/* ---------- Leads ---------- */
function staffName(uid){if(!uid)return '—';if(uid===S.user.id)return 'Jij';const s=S.staff.find(x=>x.user_id===uid);return s?s.email:'Medewerker'}
function filtered(){
 const f=S.filters,q=f.q.trim().toLowerCase();
 return S.leads.filter(l=>(!q||[l.company_name,l.contact_name,l.email].some(v=>(v||'').toLowerCase().includes(q)))&&(!f.stage||l.stage===f.stage)&&(!f.hl||l.hl_quality===f.hl)&&(!f.mandate||l.mandate_status_current===f.mandate));
}
function renderLeads(){
 const all=S.leads;
 const sum=(arr,k)=>arr.reduce((a,l)=>a+(Number(l[k])||0),0);
 const ver=all.filter(l=>l.hl_quality==='verified'),est=all.filter(l=>l.hl_quality==='estimated'),rep=all.filter(l=>l.hl_quality==='reported_invoice'||l.hl_quality==='reported_supplier');
 const open=all.filter(l=>!['closed','customer'].includes(l.stage)).length;
 const due=all.filter(l=>l.next_follow_up_at&&new Date(l.next_follow_up_at)<=new Date()&&l.stage!=='closed').length;
 $('#view').innerHTML=`
 <h1>Bier Quick Scan — leads</h1><p class="sub">Wat de ondernemer invulde blijft ongewijzigd; interne bevestigingen staan apart.</p>
 <div class="stats">
  <div class="stat"><span>Open leads</span><b>${open}</b><small>van ${all.length} totaal</small></div>
  <div class="stat"><span>Opvolging verlopen</span><b>${due}</b><small>opvolgdatum vandaag of eerder</small></div>
  <div class="stat"><span>Geverifieerd volume</span><b>${fmtHl(sum(ver,'hl_verified'))}</b><small>${ver.length} lead(s), gecontroleerd</small></div>
  <div class="stat"><span>Opgegeven met bron</span><b>${fmtHl(sum(rep,'hl_submitted'))}</b><small>${rep.length} lead(s), nog te verifiëren</small></div>
  <div class="stat"><span>Geschat volume</span><b>${fmtHl(sum(est,'hl_submitted'))}</b><small>${est.length} lead(s), eigen schatting</small></div>
 </div>
 <div class="filters">
  <input id="fq" placeholder="Zoek op bedrijf, contactpersoon of e-mail" value="${esc(S.filters.q)}">
  <select id="fstage"><option value="">Alle fases</option>${Object.entries(STAGES).map(([k,v])=>`<option value="${k}" ${S.filters.stage===k?'selected':''}>${v}</option>`).join('')}</select>
  <select id="fhl"><option value="">Alle hl-labels</option>${Object.entries(HLQ).map(([k,v])=>`<option value="${k}" ${S.filters.hl===k?'selected':''}>${v[0]}</option>`).join('')}</select>
  <select id="fm"><option value="">Alle machtigingen</option>${Object.entries(MANDATE).map(([k,v])=>`<option value="${k}" ${S.filters.mandate===k?'selected':''}>${v[0]}</option>`).join('')}</select>
  ${S.role==='admin'?'<button class="btn" id="exp">Exporteren (CSV)</button>':''}
 </div>
 <div class="layout ${S.sel?'open':''}"><div class="card" style="overflow:auto"><table><thead><tr>
  <th>Ingezonden</th><th>Onderneming</th><th class="hide-m">Brouwerij / merk</th><th>Afname 2025</th><th>Fase</th><th class="hide-m">Machtiging</th><th class="hide-m">Voorstel / overstap</th><th class="hide-m">Opvolging</th>
 </tr></thead><tbody id="rows"></tbody></table></div><div id="detail" class="card detail" ${S.sel?'':'hidden'}></div></div>`;
 const rows=filtered();
 $('#rows').innerHTML=rows.length?rows.map(l=>`<tr data-id="${esc(l.lead_id)}" class="${S.sel===l.lead_id?'sel':''}">
  <td>${fmtDate(l.submitted_at)}</td>
  <td><b>${esc(l.company_name)}</b><span class="s">${esc(l.contact_name)} · ${esc(l.email)}</span></td>
  <td class="hide-m">${esc(l.brewery_supplier||'—')}<span class="s">${esc(l.tap_beer_brand||'')}</span></td>
  <td>${l.hl_quality==='verified'?fmtHl(l.hl_verified):fmtHl(l.hl_submitted)}<span class="s">${chip(HLQ[l.hl_quality])}</span></td>
  <td>${chip([STAGES[l.stage]||l.stage,STAGE_CLS[l.stage]||'c-grey'])}<span class="s">${esc(staffName(l.assigned_to))}</span></td>
  <td class="hide-m">${chip(MANDATE[l.mandate_status_current])}</td>
  <td class="hide-m">${esc(SHORT.proposal_interest[l.proposal_interest]||'—')} / ${esc(SHORT.willingness_to_switch[l.willingness_to_switch]||'—')}</td>
  <td class="hide-m">${l.next_follow_up_at?fmtDate(l.next_follow_up_at):'—'}</td></tr>`).join(''):`<tr><td colspan="8" class="empty">${all.length?'Geen leads met deze filters.':'Nog geen inzendingen.'}</td></tr>`;
 document.querySelectorAll('#rows tr[data-id]').forEach(tr=>tr.onclick=()=>{S.sel=tr.dataset.id;renderLeads()});
 const bind=(id,k)=>{const e=$(id);e.oninput=e.onchange=()=>{S.filters[k]=e.value;const pos=e.selectionStart;renderLeads();const n=$(id);n.focus();if(pos!=null&&n.setSelectionRange)n.setSelectionRange(pos,pos)}};
 bind('#fq','q');bind('#fstage','stage');bind('#fhl','hl');bind('#fm','mandate');
 if($('#exp'))$('#exp').onclick=doExport;
 if(S.sel)renderDetail(S.sel);
}
async function renderDetail(id){
 const l=S.leads.find(x=>x.lead_id===id),box=$('#detail');if(!l){box.hidden=true;return}
 box.innerHTML='<p class="hint">Laden…</p>';
 try{
  const [sub,notes,vers,mand,evs]=await Promise.all([api.submission(l.submission_id),api.notes(id),api.verifications(id),api.mandate(id),api.events(id)]);
  const a=sub?.answers||{};
  const canEdit=S.role==='reviewer'||S.role==='admin';
  const nexts=S.transitions.filter(t=>t.from_stage===l.stage&&(t.min_role==='reviewer'||S.role==='admin'));
  box.innerHTML=`
  <button class="btn small close" id="dclose">Sluiten</button>
  <h2>${esc(l.company_name)}</h2>
  <p class="sub">${esc(l.contact_name)} · ${esc(l.email)}${l.phone?' · '+esc(l.phone):''}<br>Ingezonden ${fmtDT(l.submitted_at)} · ${chip([STAGES[l.stage],STAGE_CLS[l.stage]])}</p>

  <h3>Ingevuld door ondernemer</h3>
  <div class="box orig">${Q.filter(([k])=>a[k]!=null&&a[k]!=='').map(([k,label,map])=>`<div class="kv"><span>${esc(label.trim())}</span><b>${esc(ansLabel(k,a[k],map))}</b></div>`).join('')||'<p class="hint">Geen antwoorden.</p>'}
   <div class="kv"><span>15. Aanvullen gegevens</span><b>${esc(ROUTE[sub?.data_route]||sub?.data_route||'—')}</b></div>
   <p class="hint">Privacyversie ${esc(sub?.privacy_notice_version||'—')}. Deze gegevens zijn niet te wijzigen.</p></div>

  <h3>Bevestigd door Horeca United</h3>
  <div class="box int">
   <div class="kv"><span>Afname 2025 — label</span><b>${chip(HLQ[l.hl_quality])}</b></div>
   <div class="kv"><span>Opgegeven</span><b>${fmtHl(l.hl_submitted)}</b></div>
   <div class="kv"><span>Geverifieerd</span><b>${l.hl_verified!=null?fmtHl(l.hl_verified):'nog te verifiëren'}</b></div>
   ${vers.length?vers.map(v=>`<div class="note"><span>${fmtDT(v.verified_at)} · ${esc(v.field)} ${v.period_year?esc(v.period_year):''} · ${esc(v.outcome)} · bron: ${esc(v.evidence_kind)}</span>${esc(JSON.stringify(v.submitted_value))} → <b>${esc(JSON.stringify(v.verified_value))}</b> — ${esc(v.note)}</div>`).join(''):''}
   ${canEdit?`<div class="form" id="fver"><div class="row"><input id="vval" type="number" min="0" max="100000" step="any" placeholder="Bevestigde hl (2025)"><select id="vkind"><option value="invoice">Factuur / jaaroverzicht</option><option value="supplier_statement">Opgave leverancier</option><option value="document">Document (na upload)</option><option value="call_note">Telefonisch bevestigd</option></select></div>
    <input id="vnote" placeholder="Wat heb je gecontroleerd? (verplicht)"><button class="btn" id="vgo">Hectoliters vastleggen</button><div class="msg" id="vmsg"></div></div>`:''}
  </div>

  ${mand?`<h3>Machtiging</h3><div class="box int">
   <div class="kv"><span>Status</span><b>${chip(MANDATE[mand.status])}</b></div>
   <div class="kv"><span>Tekstversie</span><b>${esc(mand.consent_text_version)}</b></div>
   <div class="kv"><span>Akkoord gegeven</span><b>${fmtDT(mand.consent_at)}</b></div>
   ${mand.authority_check_method?`<div class="kv"><span>Bevoegdheid gecontroleerd</span><b>${esc(mand.authority_check_method)} · ${fmtDT(mand.authority_checked_at)}</b></div>`:''}
   ${canEdit&&mand.status!=='revoked'?`<div class="form"><div class="row"><select id="mstat"><option value="verified">Bevoegdheid geverifieerd</option><option value="rejected">Afwijzen</option><option value="revoked">Ingetrokken door klant</option></select><select id="mmeth"><option value="kvk_extract">KvK-uittreksel</option><option value="owner_confirmation">Bevestiging eigenaar</option><option value="signed_statement">Getekende verklaring</option><option value="other">Anders</option></select><select id="mvia"><option value="">Intrekking via…</option><option value="email">E-mail</option><option value="phone">Telefoon</option><option value="in_person">Persoonlijk</option><option value="other">Anders</option></select></div>
   <input id="mnote" placeholder="Toelichting (verplicht bij verifiëren)"><button class="btn" id="mgo">Machtiging bijwerken</button><div class="msg" id="mmsg"></div></div>`:''}
  </div>`:''}

  ${canEdit?`<h3>Fase en opvolging</h3><div class="box int"><div class="form">
   <div class="row"><select id="snext">${nexts.length?nexts.map(t=>`<option value="${t.to_stage}">${esc(STAGES[t.to_stage])}</option>`).join(''):'<option value="">Geen vervolgstap mogelijk</option>'}</select></div>
   <input id="snote" placeholder="Toelichting (verplicht bij afsluiten)"><button class="btn primary" id="sgo" ${nexts.length?'':'disabled'}>Fase wijzigen</button><div class="msg" id="smsg"></div>
   <div class="row" style="margin-top:8px"><input id="afu" type="date" value="${l.next_follow_up_at?esc(l.next_follow_up_at.slice(0,10)):''}"><select id="apr">${['unknown','high','medium','low'].map(p=>`<option value="${p}" ${l.priority===p?'selected':''}>${{unknown:'Prioriteit onbekend',high:'Hoog',medium:'Middel',low:'Laag'}[p]}</option>`).join('')}</select></div>
   <button class="btn" id="ago">${l.assigned_to===S.user.id?'Opvolging bijwerken':'Aan mij toewijzen + opvolging'}</button><div class="msg" id="amsg"></div>
  </div></div>`:''}

  <h3>Interne notities</h3><div class="box">
   ${canEdit?`<div class="form"><textarea id="nbody" maxlength="4000" placeholder="Zakelijke notitie (geen gezondheids- of privégegevens)"></textarea><button class="btn" id="ngo">Notitie toevoegen</button><div class="msg" id="nmsg"></div></div>`:''}
   ${notes.length?notes.map(n=>`<div class="note"><span>${fmtDT(n.created_at)}</span>${esc(n.redacted_at?'[afgeschermd]':n.body)}</div>`).join(''):'<p class="hint">Nog geen notities.</p>'}
  </div>

  <h3>Tijdlijn</h3><ul class="timeline">${evs.map(e=>`<li><span>${fmtDT(e.created_at)}${e.actor_role?' · '+esc(ROLE[e.actor_role]||e.actor_role):' · systeem'}</span>${esc(eventText(e))}</li>`).join('')||'<li>Geen gebeurtenissen.</li>'}</ul>`;

  if($('#vgo'))$('#vgo').onclick=()=>run('#vgo','#vmsg',()=>{const v=$('#vval').value;if(v==='')throw new Error('Vul de bevestigde hoeveelheid in.');const n=Number(v);return api.verify(id,'annual_volume_hl',2025,n,'hl',(l.hl_submitted!=null&&Number(l.hl_submitted)===n)?'confirmed':'corrected',$('#vkind').value,$('#vnote').value.trim())},'Vastgelegd.');
  if($('#mgo'))$('#mgo').onclick=()=>run('#mgo','#mmsg',()=>{const st=$('#mstat').value;return api.mandateDecide(mand.id,st,st==='revoked'?null:$('#mmeth').value,$('#mnote').value.trim(),st==='revoked'?($('#mvia').value||null):null)},'Bijgewerkt.');
  if($('#sgo'))$('#sgo').onclick=()=>run('#sgo','#smsg',()=>api.setStage(id,$('#snext').value,$('#snote').value.trim()),'Fase gewijzigd.');
  if($('#ago'))$('#ago').onclick=()=>run('#ago','#amsg',()=>{const dt=$('#afu').value;return api.assign(id,S.user.id,dt?new Date(dt+'T09:00:00').toISOString():null,$('#apr').value)},'Bijgewerkt.');
  if($('#ngo'))$('#ngo').onclick=()=>run('#ngo','#nmsg',()=>{const t=$('#nbody').value.trim();if(!t)throw new Error('Schrijf eerst een notitie.');return api.addNote(id,t)},'Toegevoegd.');
 }catch(e){box.innerHTML=`<button class="btn small close" onclick="S.sel=null;renderLeads()">Sluiten</button><p class="msg err">${esc(errText(e))}</p>`}
}
function eventText(e){const d=e.details||{};switch(e.event_type){
 case 'lead_created':return 'Lead aangemaakt uit Quick Scan-inzending';
 case 'stage_changed':return `Fase: ${STAGES[d.from]||d.from||'?'} → ${STAGES[d.to]||d.to||'?'}${d.note?' — '+d.note:''}`;
 case 'lead_assigned':return 'Toewijzing / opvolging bijgewerkt';
 case 'note_added':return 'Notitie toegevoegd';
 case 'field_verified':return `Verificatie ${d.field||''}: ${d.outcome||''} (${d.evidence_kind||''})`;
 case 'export':return `Export (${d.rows??'?'} rijen)`;
 default:return e.event_type.replace(/_/g,' ')}}
async function reload(id){S.leads=await api.leads()||[];S.sel=id;renderLeads()}
async function doExport(){
 try{const rows=await api.exportLeads();const cols=['submitted_at','company_name','contact_name','email','phone','brewery_supplier','tap_beer_brand','distributor','hl_submitted','hl_quality','hl_verified','stage','mandate_status_current','proposal_interest','willingness_to_switch','contract_end_status','data_route','next_follow_up_at'];
  const cell=v=>{let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
  const csv='﻿'+cols.join(';')+'\n'+rows.map(r=>cols.map(c=>cell(r[c])).join(';')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='huos-bier-leads-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
 }catch(e){alert(errText(e))}
}

  ${S.staff.map(s=>`<tr style="cursor:default"><td>${esc(s.email)}${s.user_id===S.user.id?' <span class="chip c-info">jij</span>':''}</td><td>${esc(ROLE[s.role]||s.role)}</td><td>${esc(SCOPE[s.scope]||s.scope)}${(s.scope_values||[]).length?': '+esc(s.scope_values.join(', ')):''}</td><td>${s.active?chip(['Actief','c-ok']):chip(['Ingetrokken','c-grey'])}</td><td class="hide-m">${fmtDT(s.last_sign_in_at)}</td><td>${s.active&&s.user_id!==S.user.id?`<button class="btn small" data-rev="${esc(s.user_id)}">Intrekken</button>`:''}</td></tr>`).join('')}

  document.querySelectorAll('[data-rev]').forEach(b=>b.onclick=async()=>{const reason=prompt('Reden voor intrekken (verplicht):');if(!reason)return;try{await api.revoke(b.dataset.rev,reason);renderStaff()}catch(e){alert(errText(e))}});

 }catch(e){$('#view').innerHTML=`<p class="msg err">${esc(errText(e))}</p>`}
}
function staffEmail(uid){const s=S.staff.find(x=>x.user_id===uid);return s?s.email:(uid?uid.slice(0,8)+'…':'—')}
