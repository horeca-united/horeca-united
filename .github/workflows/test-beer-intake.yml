name: Test backend functions

on:
  pull_request:
    paths:
      - ".github/workflows/test-beer-intake.yml"
      - "supabase/functions/**/*.test.mjs"
      - "supabase/migrations/20261125000000_huos_admin_audit_log.sql"
  push:
    paths:
      - ".github/workflows/test-beer-intake.yml"
      - "supabase/functions/**/*.test.mjs"
      - "supabase/migrations/20261125000000_huos_admin_audit_log.sql"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run all Node unit tests
        run: node --test 'supabase/functions/**/*.test.mjs'

      - name: Deno check beer-intake
        run: npx --yes deno check supabase/functions/huos-beer-intake/index.ts

      - name: Deno format check
        run: npx --yes deno fmt --check supabase/functions/

      - name: Git diff check
        run: git diff --check
